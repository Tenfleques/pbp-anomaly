[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pbp-anomaly"
version = "0.2.0"
description = "Training-free anomaly detection via pseudo-Boolean polynomial decomposition"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Tendai Chikake", email = "tendaichikake@gmail.com"},
    {name = "Boris Goldengorin"},
]

dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "tmc-pbp @ git+https://github.com/Tenfleques/tmc-pbp.git",
]

[project.optional-dependencies]
noaa = ["requests"]
figures = ["matplotlib>=3.5"]
dev = ["pytest>=7.0"]
all = ["requests", "matplotlib>=3.5", "pytest>=7.0"]

[project.urls]
Repository = "https://github.com/Tenfleques/pbp-anomaly"

[project.scripts]
pbp-anomaly = "pbp_anomaly.cli:main"

[tool.setuptools.packages.find]
include = ["pbp_anomaly*"]
